<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anda Sedang Offline - Presensi PT. CAK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <style>
        :root {
            --md-sys-color-primary: #1565C0;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-surface: #FAFAFA;
            --md-sys-color-on-surface: #1C1B1F;
            --md-sys-color-on-surface-variant: #546E7A;
            --md-sys-color-error-container: #FFDAD6;
            --md-sys-color-on-error-container: #410002;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .offline-card {
            background: #FFFFFF;
            max-width: 400px;
            width: 100%;
            padding: 40px 24px;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);
            border: 1px solid #E2E2E6;
        }

        .offline-icon {
            width: 64px;
            height: 64px;
            background-color: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .offline-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .offline-desc {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 48px;
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">
            <span class="material-symbols-rounded" style="font-size: 32px;">wifi_off</span>
        </div>
        <h1 class="offline-title">Koneksi Terputus</h1>
        <p class="offline-desc">Perangkat Anda saat ini sedang tidak terhubung ke jaringan internet. Periksa koneksi data atau Wi-Fi Anda untuk melanjutkan presensi.</p>
        <button class="btn-retry" onclick="window.location.reload();">
            <span class="material-symbols-rounded" style="font-size: 20px;">refresh</span>
            Coba Muat Ulang
        </button>
    </div>
</body>
</html>
