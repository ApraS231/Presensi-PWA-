    <text x="0" y="15" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0D47A1" letter-spacing="0.5">PT. CAK</text>
    <text x="0" y="27" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#757575" letter-spacing="0.2">Cahaya Anugrah K.</text>
